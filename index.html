<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d31">
  <meta name="description" content="Aplikasi kasir digital untuk toko dan warung Anda.">
  <title>KASIR SB - SB Digital Studio</title>

  <link rel="manifest" href="./manifest.json?v=4">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f6f5;
      color: #173d31;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 28px 20px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 18px #00000012;
    }
    .logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    h1 { margin: 8px 0; }
    p { color: #4b5563; line-height: 1.6; }
    .button {
      display: block;
      margin-top: 24px;
      padding: 15px;
      border-radius: 10px;
      background: #173d31;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .note { margin-top: 22px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="container">
    <img class="logo" src="./icon-512.png" alt="Logo SB Digital Studio">
    <h1>KASIR SB</h1>
    <p>Aplikasi kasir digital untuk toko dan warung Anda.</p>

    <a class="button"
       href="https://script.google.com/macros/s/AKfycbxCZGEQcWM9_pJcdwnfHtIiV0GMFBp1wyU69ua4_xw1Mjj1CQ1hcFp68vc6JGcUHOeA/exec"
       target="_blank" rel="noopener">
      Buka Aplikasi Kasir
    </a>

    <p class="note">Powered by SB Digital Studio</p>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Service Worker gagal:", error));
      });
    }
  </script>
</body>
</html>
