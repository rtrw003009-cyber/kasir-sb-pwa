
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d31">
<meta name="description" content="KASIR SB - SB Digital Studio">
<link rel="manifest" href="./manifest.json?v=4">
<link rel="icon" href="./icon-192.png">
<title>KASIR SB - SB Digital Studio</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#f4f6f5;
}
header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#173d31;
  color:white;
  font-size:14px;
  font-weight:700;
}
main{
  height:calc(100% - 48px);
}
iframe{
  width:100%;
  height:100%;
  border:0;
  background:white;
}
.notice{
  padding:18px;
  text-align:center;
  color:#333;
}
</style>
</head>

<body>
<header>KASIR SB - SB DIGITAL STUDIO</header>

<main id="app">
  <div class="notice">Memuat aplikasi KASIR SB...</div>
</main>

<script>
const GAS_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxCZGEQcWM9_pJcdwnfHtIiV0GMFBp1wyU69ua4_xw1Mjj1CQ1hcFp68vc6JGcUHOeA/exec";

if (
  GAS_WEB_APP_URL.startsWith("https://") &&
  GAS_WEB_APP_URL.endsWith("/exec")
) {
  document.getElementById("app").innerHTML =
    '<iframe title="KASIR SB" src="' +
    GAS_WEB_APP_URL +
    '" allow="clipboard-read; clipboard-write"></iframe>';
}

if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
</body>
</html>
